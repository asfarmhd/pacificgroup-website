<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Back shortly — Pacific Group of Companies</title>
  <meta name="description" content="Pacific Group of Companies — our website is briefly offline for scheduled maintenance.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/images/companies/pacific-group-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f172a;
      --navy-soft: #1e293b;
      --accent: #0e7490;
      --text: rgba(255, 255, 255, 0.96);
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.16);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, var(--navy) 0%, var(--navy-soft) 55%, #0c1222 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* Photograph sits behind a scrim heavy enough to keep every line of
       text well clear of the 4.5:1 contrast floor on any part of the image. */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url("assets/images/hero/office-atrium-1280.jpg");
      background-size: cover;
      background-position: center;
      opacity: 0.38;
    }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%,
          rgba(8, 14, 28, 0.72) 0%, rgba(8, 14, 28, 0.5) 60%, rgba(8, 14, 28, 0.2) 100%),
        linear-gradient(180deg, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.45) 40%, rgba(15, 23, 42, 0.78) 100%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .logo {
      width: 92px;
      height: auto;
      margin: 0 auto 28px;
      display: block;
      /* The source PNG is pure black artwork with transparency. The site
         header flips it with this same filter; without it the mark is
         invisible against a dark background. */
      filter: brightness(0) invert(1);
    }

    .overline {
      margin: 0 0 14px;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 1px 3px rgba(8, 14, 28, 0.6);
    }

    h1 {
      margin: 0 0 18px;
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.9rem, 5.5vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 4px rgba(8, 14, 28, 0.5), 0 8px 30px rgba(8, 14, 28, 0.4);
    }

    .lede {
      margin: 0 auto 34px;
      max-width: 480px;
      font-size: 1.0625rem;
      line-height: 1.7;
      color: var(--text);
      text-shadow: 0 1px 3px rgba(8, 14, 28, 0.55);
    }

    footer {
      margin-top: 30px;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .logo { width: 76px; margin-bottom: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <main>
    <img class="logo" src="assets/images/companies/pacific-group-logo.png" alt="Pacific Group of Companies">

    <p class="overline">Pacific Group of Companies</p>
    <h1>We&rsquo;ll be back shortly</h1>
    <p class="lede">
      Our website is briefly offline for scheduled maintenance.
    </p>

    <footer>&copy; <span id="year">2026</span> Pacific Group of Companies. All rights reserved.</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
