# Deploy Pacific Group site to Hostinger on push to main
name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  # Allows deploying manually from the Actions tab without pushing a commit.
  # dry_run connects and authenticates, reports what WOULD change, and
  # uploads nothing - use it to verify credentials without touching the site.
  workflow_dispatch:
    inputs:
      dry_run:
        # Defaulted to false deliberately. It used to default true, back when
        # this panel only existed to verify FTP credentials. Once the panel
        # also became the maintenance switch that default became a trap:
        # ticking "maintenance" and pressing Run reported success while
        # uploading nothing, so the site stayed up.
        description: "Dry run - connect and report only, UPLOAD NOTHING (leave off to actually deploy)"
        type: boolean
        default: false
      server_dir:
        description: "Override server-dir (blank = use the default below)"
        type: string
        default: ""
      maintenance:
        description: "Maintenance mode ON (public sees the maintenance page; the allowlisted IP still sees the live site)"
        type: boolean
        default: false

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Picks which .htaccess ships, and - when maintenance is on - injects the
      # banner script into the pages so whoever is allowlisted cannot browse
      # the live site without noticing that the public cannot.
      #
      # NOTE: a plain push to main sends no inputs, so this evaluates false and
      # takes the site LIVE. That is deliberate - maintenance can never be left
      # on by accident - but it does mean pushing a fix during an outage ends
      # the outage. To deploy while staying down, use "Run workflow" with
      # maintenance ticked rather than pushing.
      - name: Configure maintenance mode
        env:
          MAINTENANCE: ${{ inputs.maintenance == true || inputs.maintenance == 'true' }}
          DRY_RUN: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          if [ "$MAINTENANCE" = "true" ]; then
            cp deploy/maintenance.htaccess .htaccess
            for f in index.html our-businesses.html board-of-directors.html; do
              sed -i 's#</body>#<script src="assets/js/maintenance-banner.js" defer></script></body>#' "$f"
            done
            {
              echo "### MAINTENANCE MODE IS ON"
              echo ""
              echo "Public visitors receive HTTP 503 and the maintenance page."
              echo "The allowlisted IP still sees the live site, with an on-page banner."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cp deploy/live.htaccess .htaccess
            {
              echo "### Site is LIVE"
              echo ""
              echo "Maintenance rules cleared from .htaccess."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            {
              echo ""
              echo "> **DRY RUN - NOTHING WAS UPLOADED.**"
              echo "> The state above was prepared but not sent to the server."
              echo "> Untick \"Dry run\" and run again to apply it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "--- .htaccess being deployed ---"
          cat .htaccess

      # The exclude list below drops the source-asset dumps (Images/,
      # Company Logos/, Board Of Directors/, Client companies logos/ and the
      # duplicate root .mp4). They stay in git, but nothing in the site
      # references them, so skipping them cuts ~208 MB off every upload.
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # The deploy FTP account (u661830775.asfarmhd) is chrooted to
          # /home/u661830775/domains/pacificgroup.pk/public_html, which IS the
          # document root - so ./ is correct here. Do not "helpfully" append
          # public_html/; that lands a level deeper and serves nothing.
          server-dir: ${{ inputs.server_dir != '' && inputs.server_dir || './' }}
          timeout: 120000
          log-level: verbose
          # true only for a manual dry-run dispatch; a push always deploys for real
          # Tolerate both boolean (UI checkbox) and string (API/gh) inputs;
          # a push sends neither, so it always deploys for real.
          dry-run: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
          exclude: |
            .git/**
            .github/**
            .gitignore
            *.md
            .cursor/**
            .DS_Store
            deploy/**
            Images/**
            Company Logos/**
            Board Of Directors/**
            Client companies logos/**
            website content for sub companies/**
            wordpress website content/**
            Adobe Express - *.mp4
